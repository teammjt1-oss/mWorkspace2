name: Claude PR Review

# PR이 열리거나 갱신되면 Claude가 1차 코드 리뷰를 남긴다. 최종 승인은 사람이 한다.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            저장소: ${{ github.repository }}, PR 번호: ${{ github.event.pull_request.number }}
            CLAUDE.md의 규칙을 기준으로 이 PR을 리뷰하라.
            중점: 버그, 보안(비밀값 노출, 입력 검증, 권한), 테스트 누락, 규칙 위반.
            스타일 지적은 포맷터가 처리하므로 하지 않는다.
            구체적인 문제는 해당 줄에 인라인 코멘트로 남기고, 마지막에 한국어로 짧은 총평을 남겨라.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
